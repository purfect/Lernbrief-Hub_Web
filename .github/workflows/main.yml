name: Build Debian Package

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot rsync

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            # Debian version must start with a digit.
            SAFE_REF="${GITHUB_REF_NAME:-local}"
            SAFE_REF="$(printf '%s' "$SAFE_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.+~-]+/-/g; s/^-+//; s/-+$//')"
            [ -n "$SAFE_REF" ] || SAFE_REF="local"
            VERSION="0.0.0~${SAFE_REF}.${GITHUB_RUN_NUMBER}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]'; then
            VERSION="0.0.0~${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VERSION"

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="lernbrief-hub"
          ARCH="amd64"
          ROOT="pkg/${PKG_NAME}_${VERSION}_${ARCH}"
          APP_DST="${ROOT}/opt/${PKG_NAME}"

          mkdir -p "${ROOT}/DEBIAN" "${APP_DST}" dist

          rsync -a ./ "${APP_DST}/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "tmp" \
            --exclude "lernbrief_hub.db" \
            --exclude "build" \
            --exclude "pkg" \
            --exclude "dist"

          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: web
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Dein Name <you@example.com>
          Depends: php (>= 8.1), php-sqlite3
          Description: Lernbrief-Hub Webanwendung
           Webanwendung zur Bewertung und Lernbrief-Erstellung.
          EOF

          cat > "${ROOT}/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          install -d -m 775 -o www-data -g www-data /var/lib/lernbrief-hub || true
          install -d -m 775 -o www-data -g www-data /var/log/lernbrief-hub || true
          exit 0
          EOF
          chmod 0755 "${ROOT}/DEBIAN/postinst"

          dpkg-deb --build "${ROOT}"
          mv "${ROOT}.deb" "dist/${PKG_NAME}_${VERSION}_${ARCH}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

      - name: Install ORAS
        if: startsWith(github.ref, 'refs/tags/')
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish .deb to GitHub Packages (GHCR)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DEB_FILE="$(ls dist/*.deb | head -n 1)"
          PKG_REF="ghcr.io/${{ github.repository_owner }}/lernbrief-hub-deb:${VERSION}"

          oras push "${PKG_REF}" \
            --artifact-type application/vnd.debian.binary-package \
            "${DEB_FILE}:application/vnd.debian.binary-package"

      - name: Attach to GitHub Release (only tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
